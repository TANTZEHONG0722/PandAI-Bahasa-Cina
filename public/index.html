<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>智学华文 PandAI Bahasa Cina</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>

    <style>
        body, html { height: 100%; margin: 0; background: linear-gradient(135deg, #f8fafc, #e2e8f0); color: #1e293b; font-family: 'STKaiti', '楷体', serif !important; overflow: hidden; }
        * { font-family: inherit !important; }
        .scrollable-area { overflow-y: auto; overflow-x: hidden; scroll-behavior: smooth; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.02); border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .glass-panel { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.8); box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .nav-btn { transition: all 0.3s; border: 2px solid transparent; }
        .nav-btn.active { background: #4f46e5; color: white; box-shadow: 0 4px 15px rgba(79, 70, 229, 0.3); transform: translateY(-2px); }
        .icon-box { background: linear-gradient(135deg, #ffffff, #f1f5f9); box-shadow: inset 0 2px 4px rgba(255,255,255,0.5), 0 2px 5px rgba(0,0,0,0.1); }
        .nav-btn.active .icon-box { background: linear-gradient(135deg, #6366f1, #4f46e5); border: 1px solid #818cf8; }
        .bounce-slow { animation: bounceSlow 3s infinite alternate ease-in-out; }
        @keyframes bounceSlow { 0% { transform: translateY(0); } 100% { transform: translateY(-10px); } }
        .quiz-btn { background: white; border: 2px solid #e2e8f0; font-size: 1.1rem; font-weight: bold; padding: 1rem; border-radius: 12px; transition: all 0.1s; cursor: pointer; }
        .quiz-btn.correct { background: #22c55e; border-color: #16a34a; color: white;}
        .quiz-btn.wrong { background: #ef4444; border-color: #dc2626; color: white;}
        
        /* 登录界面的毛玻璃特效 */
        #login-portal { backdrop-filter: blur(20px); background: rgba(15, 23, 42, 0.7); transition: opacity 0.5s ease; }
        .role-btn { transition: all 0.2s; border: 2px solid transparent; }
        .role-btn.selected { border-color: #4f46e5; background-color: #e0e7ff; color: #4f46e5; font-weight: bold; }
    </style>
</head>
<body class="flex flex-col relative">

    <!-- 全屏登录大厅 -->
    <div id="login-portal" class="fixed inset-0 z-[100] flex items-center justify-center p-4">
        <div class="glass-panel w-full max-w-md rounded-3xl p-6 md:p-8 flex flex-col gap-4 relative overflow-hidden">
            <div class="text-center mb-2">
                <div class="text-5xl mb-2">🚀</div>
                <h1 class="text-2xl md:text-3xl font-bold text-slate-800">PandAI Bahasa Cina</h1>
                <p class="text-indigo-600 font-bold mt-1" id="auth-subtitle">请登录进入系统</p>
            </div>

            <!-- 身份选择 (学生/教师) -->
            <div class="flex gap-2 bg-slate-100 p-1 rounded-xl">
                <button id="role-student" onclick="window.setRole('student')" class="role-btn selected flex-1 py-2 rounded-lg text-slate-600">👦 学生</button>
                <button id="role-teacher" onclick="window.setRole('teacher')" class="role-btn flex-1 py-2 rounded-lg text-slate-600">👩‍🏫 教师</button>
            </div>

            <form id="auth-form" onsubmit="window.handleAuth(event)" class="flex flex-col gap-3">
                <input type="text" id="auth-name" placeholder="您的全名 (仅注册需填写)" class="hidden bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 outline-none focus:border-indigo-500 font-bold">
                <input type="email" id="auth-email" placeholder="DELIMa / MOE 电子邮件" required class="bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 outline-none focus:border-indigo-500 font-bold">
                <input type="password" id="auth-password" placeholder="密码 (至少6位)" required class="bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 outline-none focus:border-indigo-500 font-bold">
                
                <button type="submit" id="auth-action-btn" class="bg-indigo-600 text-white font-bold rounded-xl py-3 mt-2 shadow-lg shadow-indigo-200 active:scale-95 transition-all">登 录</button>
            </form>

            <div class="flex items-center justify-between text-sm font-bold mt-2">
                <button onclick="window.toggleAuthMode()" id="auth-toggle-btn" class="text-indigo-600 hover:underline">没有账号？点击注册</button>
                <button onclick="window.resetPassword()" class="text-slate-500 hover:underline">忘记密码？</button>
            </div>

            <div class="flex items-center gap-4 my-2">
                <div class="h-px bg-slate-200 flex-1"></div>
                <span class="text-xs font-bold text-slate-400">或</span>
                <div class="h-px bg-slate-200 flex-1"></div>
            </div>

            <button onclick="window.loginWithGoogle()" class="bg-white border-2 border-slate-200 text-slate-700 font-bold rounded-xl py-3 flex items-center justify-center gap-2 active:scale-95 transition-all hover:bg-slate-50">
                <svg class="w-5 h-5" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
                使用 Google 账号继续
            </button>
        </div>
    </div>

    <!-- 顶部导航 -->
    <header class="glass-panel z-20 flex-shrink-0 m-2 rounded-xl shadow-sm hidden" id="main-header">
        <div class="max-w-7xl mx-auto px-3 h-16 md:h-20 flex items-center justify-between">
            <div class="flex items-center gap-2 md:gap-3">
                <div class="w-10 h-10 md:w-12 md:h-12 bg-gradient-to-br from-indigo-500 to-purple-600 text-white rounded-lg md:rounded-xl flex items-center justify-center text-2xl shadow-lg pb-1">🚀</div>
                <div class="flex flex-col">
                    <span class="text-lg md:text-xl font-bold text-slate-800 tracking-wider">PandAI <span class="text-indigo-600 text-xs md:text-sm bg-indigo-50 px-2 py-0.5 rounded-full" id="user-display-name">用户</span></span>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="window.logout()" class="text-xs bg-red-50 text-red-600 px-3 py-1.5 rounded-lg font-bold border border-red-200">退出</button>
                <select id="lang-select" onchange="changeLang(this.value)" class="bg-white border-2 border-slate-200 rounded-lg px-1 py-1 text-sm font-bold outline-none cursor-pointer">
                    <option value="zh">中</option><option value="ms">BM</option><option value="en">EN</option>
                </select>
                <button onclick="toggleAudio()" class="w-8 h-8 rounded-lg bg-slate-100 border-2 border-slate-200 text-lg flex items-center justify-center pb-1"><span id="sound-icon">🔇</span></button>
            </div>
        </div>
    </header>

    <!-- 主界面内容区 -->
    <div class="flex-1 flex flex-col md:flex-row overflow-hidden max-w-7xl mx-auto w-full px-2 md:px-4 pb-[80px] md:pb-4 gap-4 min-h-0 relative hidden" id="main-content">
        
        <!-- 侧边栏/底部导航 -->
        <nav class="fixed bottom-0 left-0 w-full bg-white/95 backdrop-blur-md border-t border-slate-200 z-50 flex justify-around p-2 md:relative md:bg-transparent md:border-none md:w-72 md:flex-col md:p-4 md:gap-3 glass-panel md:rounded-2xl" id="sidebar-nav"></nav>

        <main class="flex-1 scrollable-area flex flex-col glass-panel rounded-2xl shadow-xl z-10 relative">
            
            <!-- 学生页面：萌宠大厅 -->
            <div id="view-dashboard" class="flex-1 p-4 flex flex-col items-center justify-center min-h-[400px]">
                <div class="bg-gradient-to-b from-indigo-50 to-white w-full max-w-2xl rounded-3xl p-6 text-center border border-indigo-100 shadow-sm relative">
                    <h3 class="text-2xl font-bold text-slate-800 mb-4">我的学习萌宠</h3>
                    <div class="text-7xl my-4 bounce-slow cursor-pointer" onclick="playSound('jump')" id="pet-emoji">🥚</div>
                    <h4 id="pet-name" class="text-2xl font-bold text-indigo-600 mt-2">灵力蛋</h4>
                    <button onclick="switchView('quiz')" class="mt-6 bg-indigo-600 text-white px-8 py-3 rounded-xl font-bold text-lg shadow-[0_4px_0_#3730a3] active:translate-y-1 active:shadow-none transition-all">▶️ 开始今日任务</button>
                </div>
            </div>

            <!-- 学生页面：答题区 -->
            <div id="view-quiz" class="hidden flex-1 p-4 bg-slate-50 relative min-h-[400px]">
                <div class="w-full max-w-3xl mx-auto pt-10 pb-6 flex flex-col items-center">
                    <div class="bg-white p-6 rounded-3xl mb-6 text-center relative w-full border-2 border-slate-200">
                        <h3 id="game-question" class="text-xl font-bold text-slate-800 mt-4 leading-relaxed">加载中...</h3>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3 w-full" id="game-options"></div>
                </div>
            </div>

            <!-- 通用页面：AI 助手 -->
            <div id="view-ai" class="hidden flex-1 flex flex-col bg-slate-50">
                <div class="flex-1 scrollable-area p-3 flex flex-col gap-4" id="chat-messages">
                    <div class="flex items-end gap-2 ai-msg">
                        <div class="bubble font-bold bg-white border p-3 rounded-xl rounded-bl-sm">你好！我是真正的云端大模型，有问必答！💡</div>
                    </div>
                </div>
                <div class="p-3 bg-white border-t border-slate-100 shrink-0 flex">
                    <input type="text" id="user-input" class="flex-1 bg-slate-50 border border-slate-200 rounded-l-xl px-3 outline-none font-bold" placeholder="输入你想问的问题...">
                    <button onclick="handleSend()" class="bg-indigo-600 text-white rounded-r-xl px-4 py-2 font-bold active:bg-indigo-700">发送</button>
                </div>
            </div>

            <!-- 教师页面：数据中心 -->
            <div id="view-teacher" class="hidden flex-1 p-4 md:p-6 bg-slate-50 scrollable-area">
                <h2 class="text-xl font-bold text-slate-800 mb-4">📊 教师数据中心</h2>
                <div class="bg-white rounded-xl border border-slate-200 overflow-hidden p-4 text-center">
                    <p class="text-slate-500 font-bold mb-4">欢迎来到教师端，这里将显示全班的学习进度。</p>
                    <button onclick="switchView('ai')" class="bg-purple-100 text-purple-700 px-4 py-2 rounded-lg font-bold">👉 去体验 AI 助手生成教案</button>
                </div>
            </div>
        </main>
    </div>

    <!-- 引入 Firebase 云端 SDK (模块化语法) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, sendPasswordResetEmail, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";
        
        // 您的专属配置密钥
        const firebaseConfig = {
            apiKey: "AIzaSyCq1wRqEta9Ow-q67TOqbz2GnPq-caPuLQ",
            authDomain: "pandai-bahasa-cina.firebaseapp.com",
            projectId: "pandai-bahasa-cina",
            storageBucket: "pandai-bahasa-cina.firebasestorage.app",
            messagingSenderId: "160554837509",
            appId: "1:160554837509:web:957d43650afc874e775e6c",
            measurementId: "G-SPMXMPKVQ2"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let isRegisterMode = false;
        let selectedRole = 'student'; // 默认身份

        // 身份按钮切换UI
        window.setRole = (role) => {
            selectedRole = role;
            document.getElementById('role-student').classList.remove('selected');
            document.getElementById('role-teacher').classList.remove('selected');
            document.getElementById(`role-${role}`).classList.add('selected');
        };

        // 切换登录/注册模式
        window.toggleAuthMode = () => {
            isRegisterMode = !isRegisterMode;
            document.getElementById('auth-name').classList.toggle('hidden', !isRegisterMode);
            document.getElementById('auth-action-btn').innerText = isRegisterMode ? '注 册 账 号' : '登 录';
            document.getElementById('auth-toggle-btn').innerText = isRegisterMode ? '已有账号？点击登录' : '没有账号？点击注册';
            document.getElementById('auth-subtitle').innerText = isRegisterMode ? '创建您的专属账号' : '请登录进入系统';
        };

        // 邮箱密码 登录/注册 核心逻辑
        window.handleAuth = async (e) => {
            e.preventDefault();
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            const name = document.getElementById('auth-name').value || email.split('@')[0];

            Swal.fire({ title: '处理中...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
            
            try {
                if (isRegisterMode) {
                    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                    // 注册成功后，把身份存入数据库
                    await setDoc(doc(db, "users", userCredential.user.uid), {
                        name: name, email: email, role: selectedRole
                    });
                    Swal.close();
                } else {
                    await signInWithEmailAndPassword(auth, email, password);
                    Swal.close();
                }
            } catch (error) {
                Swal.fire('错误', error.message.replace('Firebase:', ''), 'error');
            }
        };

        // Google 一键登录
        window.loginWithGoogle = async () => {
            const provider = new GoogleAuthProvider();
            try {
                Swal.fire({ title: '连接 Google...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
                const result = await signInWithPopup(auth, provider);
                // 检查数据库有没有这个用户，如果没有则创建并绑定当前选择的身份
                const docRef = doc(db, "users", result.user.uid);
                const docSnap = await getDoc(docRef);
                if (!docSnap.exists()) {
                    await setDoc(docRef, { name: result.user.displayName, email: result.user.email, role: selectedRole });
                }
                Swal.close();
            } catch (error) {
                Swal.fire('错误', 'Google 登录失败', 'error');
            }
        };

        // 忘记密码
        window.resetPassword = async () => {
            const email = document.getElementById('auth-email').value;
            if(!email) return Swal.fire('提示', '请先在上方输入您的电子邮件地址', 'info');
            try {
                await sendPasswordResetEmail(auth, email);
                Swal.fire('已发送', '密码重置链接已发送到您的邮箱，请查收！', 'success');
            } catch (error) {
                Swal.fire('错误', '发送失败，请确保邮箱正确填写。', 'error');
            }
        };

        // 退出登录
        window.logout = () => signOut(auth);

        // ---------------- 监听用户登录状态 (核心路由系统) ----------------
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                // 用户已登录：隐藏大厅，获取身份
                document.getElementById('login-portal').style.opacity = '0';
                setTimeout(() => document.getElementById('login-portal').classList.add('hidden'), 500);
                
                const docRef = doc(db, "users", user.uid);
                const docSnap = await getDoc(docRef);
                
                let role = 'student'; let name = user.email.split('@')[0];
                if (docSnap.exists()) {
                    role = docSnap.data().role;
                    name = docSnap.data().name;
                }
                
                document.getElementById('user-display-name').innerText = name;
                document.getElementById('main-header').classList.remove('hidden');
                document.getElementById('main-content').classList.remove('hidden');

                // 根据身份配置菜单和界面
                window.configureLayout(role);
            } else {
                // 用户未登录：显示大厅，隐藏主内容
                document.getElementById('login-portal').classList.remove('hidden');
                document.getElementById('login-portal').style.opacity = '1';
                document.getElementById('main-header').classList.add('hidden');
                document.getElementById('main-content').classList.add('hidden');
            }
        });
    </script>

    <!-- UI 与 答题逻辑 -->
    <script>
        let isAudioInit = false; let currentRole = 'student';
        
        function initAudio() { if (isAudioInit) return; Tone.start(); isAudioInit = true; }
        function toggleAudio() { initAudio(); }
        function playSound() { initAudio(); }

        window.configureLayout = (role) => {
            currentRole = role;
            const nav = document.getElementById('sidebar-nav');
            nav.innerHTML = '';
            
            // 路由控制：只渲染符合身份的菜单
            if(role === 'student') {
                nav.innerHTML += `<button onclick="switchView('dashboard')" class="nav-btn active flex-1 p-2 bg-white rounded-xl shadow-sm text-sm font-bold">🏠 主页</button>`;
                nav.innerHTML += `<button onclick="switchView('quiz')" class="nav-btn flex-1 p-2 bg-white rounded-xl shadow-sm text-sm font-bold">🎮 答题</button>`;
                nav.innerHTML += `<button onclick="switchView('ai')" class="nav-btn flex-1 p-2 bg-white rounded-xl shadow-sm text-sm font-bold">🤖 AI</button>`;
                switchView('dashboard');
            } else {
                nav.innerHTML += `<button onclick="switchView('teacher')" class="nav-btn active flex-1 p-2 bg-white rounded-xl shadow-sm text-sm font-bold">📊 数据</button>`;
                nav.innerHTML += `<button onclick="switchView('ai')" class="nav-btn flex-1 p-2 bg-white rounded-xl shadow-sm text-sm font-bold">🤖 助手</button>`;
                switchView('teacher');
            }
        };

        window.switchView = (viewId) => {
            ['view-dashboard', 'view-quiz', 'view-ai', 'view-teacher'].forEach(id => { 
                document.getElementById(id).classList.add('hidden'); 
            });
            document.getElementById(`view-${viewId}`).classList.remove('hidden');
            if(viewId === 'quiz') startQuiz();
        };

        function startQuiz() {
            document.getElementById('game-question').innerText = "选择正确拼音：马来西亚";
            document.getElementById('game-options').innerHTML = `<button class="quiz-btn" onclick="Swal.fire('正确!','+10 XP','success')">Mǎ lái xī yà</button><button class="quiz-btn" onclick="Swal.fire('错误','','error')">Mǎ lā xī yà</button>`;
        }

        async function handleSend() {
            const input = document.getElementById('user-input');
            const text = input.value.trim(); if(!text) return;
            const chatBox = document.getElementById('chat-messages');
            chatBox.innerHTML += `<div class="flex items-end gap-2 flex-row-reverse mb-2"><div class="bubble bg-indigo-600 text-white font-bold p-3 rounded-xl rounded-br-sm">${text}</div></div>`;
            input.value = '';
            
            // 调用 Render 服务器的 AI 接口
            try {
                const res = await fetch('/api/gemini', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({prompt: text}) });
                const data = await res.json();
                chatBox.innerHTML += `<div class="flex items-end gap-2 mb-2"><div class="bubble bg-white border font-bold p-3 rounded-xl rounded-bl-sm">${data.text}</div></div>`;
            } catch(e) {
                chatBox.innerHTML += `<div class="bubble text-red-500">网络错误</div>`;
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        window.changeLang = (val) => { /* 保留原本翻译逻辑，此处精简以便阅读 */ };
    </script>
</body>
</html>
